<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - AMAZONAS Admin</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #111827; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 0.88rem; }
        th { background: #f9fafb; font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-recibido { background: #fef3c7; color: #92400e; }
        .badge-aprobado { background: #dbeafe; color: #1e40af; }
        .badge-encamino { background: #e0e7ff; color: #3730a3; }
        .badge-entregado { background: #d1fae5; color: #065f46; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        input, select, button { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }
        button { background: #0070f3; color: white; border: none; font-weight: 600; cursor: pointer; }
        .btn-success { background: #10b981; }
    </style>
</head>
<body>

    <div class="header">
        <h1>💧 AMAZONAS - Admin Dashboard</h1>
        <button onclick="cargarTodo()">🔄 Actualizar Panel</button>
    </div>

    <div class="grid">
        <!-- Formulario Crear Repartidor -->
        <div class="card">
            <h2>👤 Crear Cuenta de Repartidor</h2>
            <form id="form-repartidor">
                <div class="form-group">
                    <input type="text" id="nombre_chofer" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Correo electrónico (Login)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Contraseña de acceso" required>
                </div>
                <div class="form-group">
                    <input type="text" id="vehiculo" placeholder="Vehículo (Ej: Moto Cargo)" required>
                </div>
                <div class="form-group">
                    <input type="text" id="placa" placeholder="Placa (Ej: 4521-YNG)" required>
                </div>
                <div class="form-group">
                    <input type="text" id="telefono" placeholder="WhatsApp / Teléfono" required>
                </div>
                <button type="submit">Guardar y Crear Acceso</button>
            </form>
        </div>

        <!-- Flota de Repartidores -->
        <div class="card">
            <h2>🚚 Repartidores Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Chofer</th>
                        <th>Credenciales</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-repartidores"></tbody>
            </table>
        </div>
    </div>

    <!-- Gestión de Pedidos y Confirmación QR -->
    <div class="card">
        <h2>📦 Pedidos Recibidos y Confirmación de Pagos</h2>
        <table>
            <thead>
                <tr>
                    <th># ID</th>
                    <th>Cliente / Zona</th>
                    <th>Total / Método</th>
                    <th>Estado Pago</th>
                    <th>Estado Pedido</th>
                    <th>Asignar Repartidor</th>
                    <th>Acciones Admin</th>
                </tr>
            </thead>
            <tbody id="tabla-pedidos"></tbody>
        </table>
    </div>

    <script>
        let listaRepartidores = [];

        async function cargarTodo() {
            await cargarRepartidores();
            await cargarPedidos();
        }

        async function cargarRepartidores() {
            const res = await fetch('/api/admin/repartidores');
            listaRepartidores = await res.json();
            
            const tbody = document.getElementById('tabla-repartidores');
            tbody.innerHTML = listaRepartidores.map(r => `
                <tr>
                    <td><strong>${r.nombre_chofer}</strong><br><small>${r.vehiculo} (${r.placa})</small></td>
                    <td>${r.email}<br><small>Tel: ${r.telefono}</small></td>
                    <td><span class="badge ${r.estado === 'Online' ? 'badge-entregado' : 'badge-recibido'}">${r.estado}</span></td>
                </tr>
            `).join('');
        }

        async function cargarPedidos() {
            const res = await fetch('/api/admin/pedidos');
            const pedidos = await res.json();

            const tbody = document.getElementById('tabla-pedidos');
            tbody.innerHTML = pedidos.map(p => {
                const opcionesRepartidores = listaRepartidores.map(r => `
                    <option value="${r.id}" ${p.repartidor_id === r.id ? 'selected' : ''}>${r.nombre_chofer}</option>
                `).join('');

                let claseEstado = 'badge-recibido';
                if (p.estado === 'Aprobado') claseEstado = 'badge-aprobado';
                if (p.estado === 'En camino') claseEstado = 'badge-encamino';
                if (p.estado === 'Entregado') claseEstado = 'badge-entregado';

                return `
                    <tr>
                        <td>#${p.id}</td>
                        <td><strong>${p.cliente_nombre}</strong><br><small>📍 ${p.zona} - ${p.direccion}</small></td>
                        <td>Bs. ${p.total}<br><small><strong>${p.metodo_pago}</strong></small></td>
                        <td><span class="badge ${p.estado_pago === 'Pagado' ? 'badge-entregado' : 'badge-recibido'}">${p.estado_pago}</span></td>
                        <td><span class="badge ${claseEstado}">${p.estado}</span></td>
                        <td>
                            <select id="select-rep-${p.id}">
                                <option value="">Sin Asignar</option>
                                ${opcionesRepartidores}
                            </select>
                            <button onclick="asignarRepartidor(${p.id})" style="padding:4px; font-size:11px;">Asignar</button>
                        </td>
                        <td>
                            ${p.estado === 'Recibido' ? `
                                <button class="btn-success" onclick="aprobarPedido(${p.id}, '${p.metodo_pago}')">
                                    ${p.metodo_pago === 'QR' ? '✓ Validar QR y Aprobar' : '✓ Aprobar Pedido'}
                                </button>
                            ` : '✓ Validado'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function aprobarPedido(id, metodo) {
            await fetch(`/api/admin/pedidos/${id}/aprobar`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado_pago: metodo === 'QR' ? 'Pagado' : 'Pendiente', estado: 'Aprobado' })
            });
            alert('Pedido aprobado con éxito.');
            cargarPedidos();
        }

        async function asignarRepartidor(id) {
            const repartidorId = document.getElementById(`select-rep-${id}`).value;
            await fetch(`/api/admin/pedidos/${id}/asignar`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repartidor_id: repartidorId })
            });
            alert('Repartidor asignado.');
            cargarPedidos();
        }

        document.getElementById('form-repartidor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                nombre_chofer: document.getElementById('nombre_chofer').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                vehiculo: document.getElementById('vehiculo').value,
                placa: document.getElementById('placa').value,
                telefono: document.getElementById('telefono').value,
            };

            const res = await fetch('/api/admin/repartidores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (!res.ok) return alert(data.error);

            alert('¡Cuenta de repartidor creada exitosamente!');
            e.target.reset();
            cargarTodo();
        });

        cargarTodo();
    </script>
</body>
</html>
